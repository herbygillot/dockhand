name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vendor
        run: make vendor-check

      # The tests that evaluate Portfiles, run the guest program, or check
      # signatures as MacPorts does, run against MacPorts Base at the
      # version the evaluator is pinned to, installed as MacPorts documents:
      # the release's package for this macOS, checked against the release's
      # own checksums.
      - name: MacPorts
        run: |
          version=2.12.6
          major=$(sw_vers -productVersion | cut -d. -f1)
          base=https://github.com/macports/macports-base/releases/download/v$version
          curl -fsSLO "$base/MacPorts-$version.chk.txt"
          package=$(sed -n "s/^SHA2-256(\(MacPorts-$version-$major-[A-Za-z]*\.pkg\))= .*/\1/p" "MacPorts-$version.chk.txt")
          if [ -z "$package" ]; then echo "MacPorts $version has no package for macOS $major" >&2; exit 1; fi
          sum=$(sed -n "s/^SHA2-256($package)= //p" "MacPorts-$version.chk.txt")
          curl -fsSLO "$base/$package"
          echo "$sum  $package" | shasum -a 256 -c -
          sudo installer -pkg "$package" -target /
          echo "DOCKHAND_TEST_MACPORTS_TCLSH=/opt/local/bin/port-tclsh" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Dead code
        run: make deadcode

      - name: Build
        run: make build
