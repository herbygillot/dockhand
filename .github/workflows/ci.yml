name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vendor
        run: make vendor-check

      # The tests that evaluate Portfiles, run the guest program, or check
      # signatures as MacPorts does, run against the release MacPorts points
      # its users at, the one port selfupdate reads from RELEASE_URL, so a
      # new release meets this code as soon as it's out. It's installed as
      # MacPorts documents: the release's package for this macOS, checked
      # against the release's own checksums. The package keeps configuration
      # it finds, and ends by running selfupdate; a source marked nosync, as
      # MacPorts' own CI sets up, keeps that from fetching a ports tree these
      # tests never read.
      - name: MacPorts
        run: .github/scripts/macports.sh

      - name: Test
        run: make test

      - name: Acceptance harness self-test
        run: make acceptance-selftest

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Dead code
        run: make deadcode

      - name: Build
        run: make build

  # Row A6 of the release-candidate test (the project's plan/prime-time.md):
  # an Intel Mac, which prepares changes and checks them on GitHub. The
  # suite, MacPorts' evaluator included, runs on x86_64, and dockhand builds.
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: MacPorts
        run: .github/scripts/macports.sh

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Prepare on Intel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/macports/macports-ports.git "$RUNNER_TEMP/ports"
          export MACPORTS_TREE="$RUNNER_TEMP/ports" DOCKHAND_DB="$RUNNER_TEMP/dockhand.db" DOCKHAND_CONFIG="$RUNNER_TEMP/config.toml"
          ./dockhand setup -y | tee "$RUNNER_TEMP/setup.log"
          grep -q 'tart' "$RUNNER_TEMP/setup.log"
          ./dockhand update jq --new --plan | tee "$RUNNER_TEMP/plan.log"
          if ./dockhand check --plan 2>"$RUNNER_TEMP/check.err"; then echo "a check planned with nowhere to build" >&2; exit 1; fi
          grep -q -- '--on github' "$RUNNER_TEMP/check.err"
