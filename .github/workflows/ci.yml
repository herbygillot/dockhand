name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vendor
        run: make vendor-check

      # The tests that evaluate Portfiles, run the guest program, or check
      # signatures as MacPorts does, run against the release MacPorts points
      # its users at, the one port selfupdate reads from RELEASE_URL, so a
      # new release meets this code as soon as it's out. It's installed as
      # MacPorts documents: the release's package for this macOS, checked
      # against the release's own checksums. The package keeps configuration
      # it finds, and ends by running selfupdate; a source marked nosync, as
      # MacPorts' own CI sets up, keeps that from fetching a ports tree these
      # tests never read.
      - name: MacPorts
        run: |
          release=$(curl -fsSL https://raw.githubusercontent.com/macports/macports-base/master/config/RELEASE_URL)
          version=${release##*/v}
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then echo "MacPorts' RELEASE_URL names no release: $release" >&2; exit 1; fi
          major=$(sw_vers -productVersion | cut -d. -f1)
          base=https://github.com/macports/macports-base/releases/download/v$version
          curl -fsSLO "$base/MacPorts-$version.chk.txt"
          package=$(sed -n "s/^SHA2-256(\(MacPorts-$version-$major-[A-Za-z]*\.pkg\))= .*/\1/p" "MacPorts-$version.chk.txt")
          if [ -z "$package" ]; then echo "MacPorts $version has no package for macOS $major" >&2; exit 1; fi
          sum=$(sed -n "s/^SHA2-256($package)= //p" "MacPorts-$version.chk.txt")
          curl -fsSLO "$base/$package"
          echo "$sum  $package" | shasum -a 256 -c -
          sudo mkdir -p /opt/local/etc/macports "$RUNNER_TEMP/ports"
          echo "file://$RUNNER_TEMP/ports [default,nosync]" | sudo tee /opt/local/etc/macports/sources.conf
          sudo installer -pkg "$package" -target /
          /opt/local/bin/port version
          echo "DOCKHAND_TEST_MACPORTS_TCLSH=/opt/local/bin/port-tclsh" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Acceptance harness self-test
        run: make acceptance-selftest

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Dead code
        run: make deadcode

      - name: Build
        run: make build
