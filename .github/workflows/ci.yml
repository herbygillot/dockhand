name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The project's baseline promise: `go test ./...` passes on a machine
  # with nothing installed but Go. Tool-gated tests skip here.
  hermetic:
    name: hermetic (bare Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Makefile is the single definition of how to check, build,
      # and test; CI only invokes it, so local and CI cannot drift.
      - run: make check
      - run: make build
      - run: make test
      # Cross-compilation is the five-second guard against the
      # platform-only-symbol class (a darwin-only syscall broke every
      # Linux job once): both targets must compile from either side.
      - name: Cross-compile for darwin
        run: GOOS=darwin go build ./...

  # The same baseline on the platform dockhand actually runs on. The
  # Linux job keeps the core portable; this one makes darwin
  # compilation a merge requirement rather than a fact about the
  # maintainer's laptop — a Linux contributor cannot green a change
  # that breaks every real user's build. No MacPorts here, so
  # tool-gated tests skip and the job stays fast; the full gated suite
  # is the advisory macports job below.
  hermetic-macos:
    name: hermetic (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build
      - run: make test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # With a real tclsh the differential harness cross-checks the CST
  # against Tcl itself. DOCKHAND_TEST_REQUIRE names exactly what this
  # job installed, so a broken install fails instead of silently
  # skipping.
  tclsh:
    name: tclsh differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tclsh
        run: sudo apt-get update && sudo apt-get install -y tcl
      - run: make test
        env:
          DOCKHAND_TEST_REQUIRE: tclsh

  # The full gated suite needs a MacPorts installation for port-tclsh.
  # Installing MacPorts on a hosted runner is slow and third-party, so
  # this job is advisory: it cannot block a merge.
  macports:
    name: macports (advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MacPorts
        uses: melusina-org/setup-macports@v1
      - run: make test
        env:
          DOCKHAND_TEST_REQUIRE: tclsh,port-tclsh

  # Checks dockhand's assumptions against upstream reality — that the
  # macOS release table still names every MacPorts installer, and no
  # more. It is advisory because it fails when the world changes rather
  # than when the code does: a new MacPorts release should tell us the
  # table needs a row, not block whoever pushes next.
  upstream:
    name: upstream agreement (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
        env:
          DOCKHAND_TEST_REQUIRE: network
