version: "2"

# The exhaustiveness kit (decision D1): Go was chosen with the promise
# that sealed types and closed enums get compiler-adjacent enforcement.
# - exhaustive: every switch over a taxonomy (Outcome, portstyle.Type,
#   info.Field, syntax.ErrorType, ...) names all members; a default case
#   does not exempt it.
# - gochecksumtype: switches over the //sumtype:decl sealed interfaces
#   (syntax.Item, syntax.Segment) cover all variants.
# - errorlint: comparisons and formatting respect wrapped errors — the
#   sentinel-error standard's mechanical half.
# - testifylint: assert/require used per the house testing style.
# - depguard: the layering the judgment packages rest on, held at the
#   import line instead of at review time; the rules and the reason for
#   each forbidden edge are in the settings block below.
linters:
  enable:
    - depguard
    - errorlint
    - exhaustive
    - gochecksumtype
    - testifylint
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    errcheck:
      # Terminal rendering and best-effort shutdowns, where the error is
      # not actionable. The Fprint family is here because most of its
      # calls write to a strings.Builder, which cannot fail, and the rest
      # go to stdout or stderr, where a broken pipe kills the process
      # before any check could run. Output a caller might redirect to a
      # file is checked at its call site instead.
      #
      # Closes are deliberately absent: errcheck cannot tell a read-path
      # close from a write-path one, and excluding the category would
      # silently cover a future write whose failure means data never
      # reached disk. Each read-path close carries its own nolint.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/herbygillot/dockhand/internal/macports/eval.Evaluator).Close
        - (*github.com/herbygillot/dockhand/internal/tcl/rpc.Session).Close
    # The layering under the notes: record, ledger and the analyses are
    # split apart so that a judgment can be read, and tested, with no
    # repo, no worker and no clock behind it. Nothing in the type system says so.
    # The property lives in the import block of every file, where one
    # convenient call is enough to lose it, and losing it is quiet — the
    # tests still pass, they just need a fixture rig to run. These rules
    # name the edges that would end it, and why each one would.
    #
    # A package path matches by prefix, so a rule naming internal/git
    # covers internal/git/gittest too, and one naming net covers the
    # whole net family. Test files are in scope on purpose: a table test
    # reaching for a repo is the first sign the purity has gone.
    #
    # The pure packages are held by an ALLOW list, and the rest by deny
    # lists. A deny list only knows the edges someone thought of: the
    # analyses' ancestor, internal/verdict, importing
    # internal/macports/eval or internal/upstream passed a full run
    # clean while dragging os/exec in behind it, which is the same lost
    # property arriving by a route nobody had named. An allow list
    # inverts that — a new import is a lint failure until it is argued
    # for — and it is affordable only because these packages are meant
    # to stay small. The deny entries stay under it,
    # because prefix matching means allowing internal/verify allows the
    # tart provider too, and because the reason an edge is forbidden is
    # worth saying at the import line where someone adds it.
    #
    # Each pure package gets a second rule for its own tests, allowing
    # the harness — testify, testing, and the file reading a capture
    # sweep needs — and repeating the denials, so a test that reaches
    # for a repository still fails.
    depguard:
      rules:
        # darwin/abi decides; it never looks. It compares two
        # installations the environment already described, and every
        # value it weighs — the two manifests, where the baseline came
        # from, whether the environment was asked at all — arrives from
        # the caller that did the I/O. That is what lets the whole
        # comparison run as a table test with no worker, no repository
        # and no provider behind it, and it holds only while this
        # package cannot reach the packages that read the world.
        #
        # It is the narrower half of what internal/verdict used to hold
        # under this rule, and its allow list is narrower to match: the
        # measurement speaks Mach-O and artifact, and nothing else.
        abi:
          files:
            - "**/internal/darwin/abi/**"
            - "!**/internal/darwin/abi/*_test.go"
          allow:
            - sort
            # strconv, for the one comparison that cannot be made as
            # text: a Mach-O compatibility version is numbers, and real
            # libraries reach two digits — this machine's own libImath
            # announces 30.0.0 — so "10.0.0" < "2.0.0" as a string would
            # call an ordinary upgrade a break. A digit compare
            # hand-rolled to stay off this list would be the same
            # arithmetic with its bugs hidden. It reads nothing, which
            # is what this list is about.
            - strconv
            - strings
            # artifact holds the installed facts the comparison reads;
            # they left verify so the record and the analyses can name a
            # fact without importing the provider that observed it. It
            # is this package's ONE dockhand edge, which is the ruled
            # import direction stated where it would be broken.
            - github.com/herbygillot/dockhand/internal/artifact
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/verify
              desc: the ruled direction gives this package one edge and it goes to artifact; the three baseline-source words are declared here and pinned equal to the provider's by a test, which is the only place the two spellings meet
            - pkg: github.com/herbygillot/dockhand/internal/record
              desc: a measurement is not a finding — the note's kinds closed around what a record carries, and the cohort proposal is what states this measurement's criterion
            - pkg: github.com/herbygillot/dockhand/internal/macports
              desc: an install name is not a MacPorts version; nothing here orders one, and a package that could evaluate a Portfile would stop being a comparison of two captures
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: the caller reads the repo and passes the facts in; a judgment that opens git needs one to be tested
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: custody of the notes is the ledger's; this compares what it is handed
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: the criterion's words are produced here because they ride a commit body; everything else about presentation is the projection layer's, with its own goldens
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli sits at the top; nothing this low may call back
            - pkg: os/exec
              desc: what otool printed is parsed where the capture happens; a comparison that ran a command would be measuring this machine
            - pkg: net
              desc: the network is the caller's; the same two manifests have to compare the same offline
        # darwin/abi's own tests: the same package, the harness, and the
        # one file read — the captures in internal/macports/build, read
        # by relative path so a real `otool` capture dropped into them
        # fails the transcription here rather than agreeing with itself
        # forever.
        #
        # verify is allowed HERE and denied above, and the asymmetry is
        # the point: the package declares the three baseline-source
        # words itself because it may not import the provider, and one
        # test asserts those three constants equal the provider's. The
        # import that would be a lost property in the package is the
        # mechanism that stops the two spellings drifting.
        abi-tests:
          files:
            - "**/internal/darwin/abi/*_test.go"
          allow:
            - os
            - sort
            - strings
            - testing
            - github.com/stretchr/testify
            - github.com/herbygillot/dockhand/internal/artifact
            - github.com/herbygillot/dockhand/internal/verify
          deny:
            - pkg: os/exec
              desc: a table test that shells out is testing the machine, not the comparison
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: the captures are files; a test that boots a worker proves something else
        # dependents decides who a moved library obliges, and it never
        # looks either. The rows arrive from the caller that read the
        # index, the in-flight branches from the caller that read the
        # repository, and the maintainer's comments from the note — an
        # ordering that walked the tree to place a cohort would need a
        # checkout to be argued about, which is the one thing this
        # decision most needs to be arguable without.
        #
        # macports/portindex is allowed and it is the ruled exception:
        # From folds index rows into Dependents, and the ruling that
        # kept this package at the top level kept the translation in it,
        # so the import says "I am built from the reverse index" rather
        # than scattering the same loop across every caller that holds
        # the two facts the index cannot carry. The rest of the macports
        # subtree — where the tree is read and Tcl is run — is off the
        # allow list and therefore already refused; the two entries
        # below name the routes that would drag a Tcl shell in, because
        # depguard reads a deny before an allow and a trailing-slash
        # denial here would take the index down with it.
        #
        # macports/port is deliberately NOT named, and the reason is
        # measured rather than assumed: its path is a PREFIX of
        # macports/portindex, so denying it by name refuses the index
        # too — depguard matches a deny by prefix and a deny outranks a
        # longer allow. The allow list already refuses it, which is the
        # whole argument for holding these two packages by allow.
        dependents:
          files:
            - "**/internal/dependents/**"
            - "!**/internal/dependents/*_test.go"
          allow:
            - sort
            - strconv
            - strings
            - github.com/herbygillot/dockhand/internal/darwin/abi
            - github.com/herbygillot/dockhand/internal/macports/portindex
            - github.com/herbygillot/dockhand/internal/record
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the reverse index is the one thing this reads rows from; evaluating a Portfile to learn a dependency is the walk this decision refuses to be able to make
            - pkg: github.com/herbygillot/dockhand/internal/macports/build
              desc: what a build needs is the provider's concern; a proposal that could ask for one has stopped being a decision about the index
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: which branch is already carrying a port is a fact the caller scans for and passes in as InFlight
            - pkg: github.com/herbygillot/dockhand/internal/gh
              desc: a cohort is proposed from the tree and the measurement; a forge has nothing to say about who needs a revision bump
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: custody of the notes is the ledger's; the proposal is handed the findings a record already carries
            - pkg: github.com/herbygillot/dockhand/internal/verify
              desc: whether a member built is run's judgment; this one is about what the index declares and what the measurement said
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: the decision states the reason on every candidate; choosing sentences for a reader is the projection layer's job, with its own goldens
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli sits at the top; nothing this low may call back
            - pkg: os/exec
              desc: a proposal that shells out is not a proposal, it is a second opinion from the machine
            - pkg: net
              desc: the same rows have to propose the same cohort offline
        # dependents' own tests: the same decision, the harness, the
        # index rows From translates, and darwin/abi — because the
        # measurements these tests are handed are taken through the real
        # comparator rather than fabricated as literals, so a decline
        # sentence cannot pass against a verdict nothing produces.
        dependents-tests:
          files:
            - "**/internal/dependents/*_test.go"
          allow:
            - testing
            - github.com/stretchr/testify
            - github.com/herbygillot/dockhand/internal/artifact
            - github.com/herbygillot/dockhand/internal/darwin/abi
            - github.com/herbygillot/dockhand/internal/macports/portindex
            - github.com/herbygillot/dockhand/internal/record
          deny:
            - pkg: os/exec
              desc: a table test that shells out is testing the machine, not the decision
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the rows are values; a test that evaluated a Portfile to get them would prove something about the tree
            - pkg: github.com/herbygillot/dockhand/internal/macports/build
              desc: the rows are values; a test that assembled a build to get them would prove something else
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: a cohort needs no worker to be argued about, which is most of the point of it being pure
        # darwin/xcode is a table about the operating system: which
        # Apple toolchain a Darwin release expects, and which one it
        # cannot run. It left the tart provisioner because a second
        # provider could not reach it there, so what it must not acquire
        # is any knowledge of how a guest is booted — the allow list is
        # one edge wide, and platform.Release is the whole of its input.
        darwin-xcode:
          files:
            - "**/internal/darwin/xcode/**"
            - "!**/internal/darwin/xcode/*_test.go"
          allow:
            - github.com/herbygillot/dockhand/internal/platform
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/verify
              desc: a fact about macOS is not a fact about a verification provider; this table moved out of one so that a second could read it
            - pkg: github.com/herbygillot/dockhand/internal/tool
              desc: which binaries this machine has is the provisioner's question; this answers about a release, not about a host
            - pkg: os/exec
              desc: the table is knowledge, not a probe; asking the machine would answer about the machine dockhand runs on rather than the guest
        # darwin/xcode's own tests: the table, the harness, and base's
        # version ordering — the recommendation is checked to be BELOW
        # the bound with the same comparison the archive picker uses,
        # because 4.0 against 30.0 is the pair a text compare gets
        # wrong.
        darwin-xcode-tests:
          files:
            - "**/internal/darwin/xcode/*_test.go"
          allow:
            - testing
            - github.com/stretchr/testify
            - github.com/herbygillot/dockhand/internal/macports
            - github.com/herbygillot/dockhand/internal/platform
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/macports/
              desc: version ordering is base's arithmetic; a test that evaluated a Portfile to get a version proves something else
            - pkg: os/exec
              desc: a table test that shells out is testing the machine, not the table
        # record is the wire and nothing else — the note's field order,
        # its states, and the strict codec that refuses a future schema
        # or a sha that does not match. Everything that stores, judges or
        # renders a note imports it, so it must not learn where a note is
        # kept, who writes one, or what any of it is worth.
        record:
          files:
            - "**/internal/record/**"
            - "!**/internal/record/*_test.go"
          allow:
            - encoding/json
            - errors
            - fmt
            - sort
            # time is a type and not a clock. Schema 3 records when a
            # claim was taken, when a hold went on, when the base was
            # committed; the values are always the caller's clock read,
            # passed in. Nothing here calls time.Now, and a leaf that
            # did would make a note's bytes depend on when they were
            # written rather than on what was observed.
            - time
            # artifact holds the installed facts a run's evidence carries;
            # they left verify so the record can name a fact without importing
            # the provider that observed it.
            - github.com/herbygillot/dockhand/internal/artifact
            # edit is the shared byte-span vocabulary and its typed Kind:
            # a change's regions are what the machine-publication ruling
            # is decided on, so the record must be able to name one
            # without importing a planner that produced it.
            - github.com/herbygillot/dockhand/internal/edit
            - github.com/herbygillot/dockhand/internal/verify
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: record makes the bytes; putting them somewhere is the ledger's job
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: the ledger imports record, not the other way about
        # record's own tests: the wire, the harness, and the clock a job
        # timestamp needs. The bytes are pinned as string constants, so
        # nothing here reads a file or a repository.
        record-tests:
          files:
            - "**/internal/record/*_test.go"
          allow:
            - encoding/json
            - errors
            - fmt
            - sort
            - strings
            - testing
            - time
            - github.com/stretchr/testify
            # artifact holds the installed facts a run's evidence carries;
            # they left verify so the record can name a fact without importing
            # the provider that observed it.
            - github.com/herbygillot/dockhand/internal/artifact
            # edit is the shared byte-span vocabulary and its typed Kind:
            # a change's regions are what the machine-publication ruling
            # is decided on, so the record must be able to name one
            # without importing a planner that produced it.
            - github.com/herbygillot/dockhand/internal/edit
            - github.com/herbygillot/dockhand/internal/verify
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: record makes the bytes; putting them somewhere is the ledger's job
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: the ledger imports record, not the other way about
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: the tests pin bytes; a provider under them would prove something else
        # report is what remained of render once the two PUBLISHED
        # renderings moved to the lifecycles that publish them — the pull
        # request body to publish, the cohort commit message to change —
        # so that the words upstream reads are written by the package
        # that sends them and this package holds only the words an
        # OPERATOR reads.
        #
        # Its promise is that every byte is a function of the arguments:
        # a branch standing, a pass summary, a plan summary, the one
        # remedy line. The clock is the plainest case — Standings is
        # handed the caller's clock read, and the moment it could take
        # its own, a golden pinning a running attempt's line would depend
        # on when the test ran. The residency is the second: it arrives
        # already probed, on the operation's own result, because a report
        # that read the lock a second time could disagree with the
        # judgment that was already made from the first read.
        #
        # A deny list rather than an allow list, for the reason render's
        # was one: what this package promises is narrower than purity —
        # it imports app in order to render an operation's result, and
        # plan in order to print one — these are the edges that would end
        # it, and the reason each is forbidden is worth saying at the
        # import line where somebody would add it. The os/exec entry is
        # what the property is checked against.
        report:
          files:
            - "**/internal/report/**"
            - "!**/internal/report/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: a sha arrives already read; a projection that can open a repository needs one to be checked
            - pkg: github.com/herbygillot/dockhand/internal/gh
              desc: a pull request's facts come from the gather that fetched them; wording that queried its own would need a network to pin
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: the record arrives already read; custody of the notes is the ledger's
            - pkg: github.com/herbygillot/dockhand/internal/statestore
              desc: the state arrives on app.StatusResult, already read under the flock; a report that opened a transaction would be an operation
            - pkg: github.com/herbygillot/dockhand/internal/intent
              desc: what the user asked for is resolved before the words are chosen, never while choosing them
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli calls report, so report must not call back — and "nothing outside report imports report" is the other half of the same criterion
            - pkg: github.com/herbygillot/dockhand/internal/lockfile
              desc: the residency arrives already probed, on the result; a projection that took a lock would be deciding rather than describing
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: report may speak verify's vocabulary but never the provider that boots and polls workers
            - pkg: os/exec
              desc: a sentence that shells out is not a function of its arguments, and no golden can pin one
            - pkg: net
              desc: the same values have to render the same bytes offline
        # ledger holds custody of the notes — the read, the flock, the
        # re-read inside it, the write, the scans. It touches git and the
        # lockfile because that is the entire job. What it must not
        # acquire is an opinion, since a scan that decides what it found
        # puts that decision back behind I/O, or a caller's terminal.
        ledger:
          files:
            - "**/internal/ledger/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/intent
              desc: custody of the notes does not vary with what the user asked for
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli calls the ledger, so the ledger must not call back
        # gh is the client and nothing above it: the seam that runs the
        # binary, the pull request lookups, and fork and upstream
        # resolution. It answers with facts and holds no opinion about
        # them. What a pull request means is mapped by the caller into
        # what verdict weighs, and how any of it is worded is render's,
        # which is what lets a duplicate-PR decision be read, and tested,
        # with no gh on the machine at all.
        #
        # The edges below are the ways it would acquire an opinion, and
        # each one would make running the tool a prerequisite for
        # reading the judgment that came out of it. The rule covers the
        # whole subtree rather than the package's own files, so a test
        # double standing in for the client is held to the same line as
        # the client.
        gh:
          files:
            - "**/internal/gh/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/record
              desc: a pull request is not a note; a client that knew the wire format would start deciding what goes on one
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: gh answers about pull requests and keeps nothing; custody of the notes is the ledger's
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: the words left this package deliberately; a client that phrases its answers takes their goldens back with it
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli calls gh, so gh must not call back
        # lease owns one of the four durable lifecycles: what this
        # checkout has been handed by a provider and what it owes back.
        # Its promise is narrower than purity and worth naming — it is
        # the ONE package that both writes lease records and calls a
        # provider, so what it must not do is grow a second opinion about
        # anything else. The three steps it is made of (a transaction, a
        # provider call outside every lock, a transaction) only stay
        # separable while nothing here can reach a verb, a peer lifecycle
        # or a named backend.
        #
        # os/exec is deliberately NOT denied, and it is the one edge worth
        # justifying rather than forbidding: Standing rests on a (PID,
        # start-time) pair against this host's process table, and `ps` is
        # how a Go program without a vendored syscall package asks. It is
        # confined to liveness.go behind one variable, which is also what
        # makes the decision testable.
        lease:
          files:
            - "**/internal/lease/**"
            - "!**/internal/lease/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes the operations that call lease, so lease must not call back
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: an obligation carries a typed Kind and Standing precisely so nothing here has to choose a sentence; a lease that could phrase its own report would start deciding from words (rule 6)
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: the note is a derived export; this lifecycle writes the state ref and nothing else
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: that a job's id is the environment's name is one backend's fact — the whole point of Worker.Job and RequestLookup is that the kernel never learns it
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: the one ref-mover is statestore, and lease reaches git only through it (R23)
        # lease's own tests, on record-tests' precedent: the same denials,
        # and the fixture repository the record has to live in.
        #
        # gittest is the one edge that opens, and it opens because these
        # tests drive a REAL statestore over a REAL repository — what they
        # prove is an ordering of writes against a compare-and-set, and a
        # fake store would prove something about the fake. internal/git
        # itself stays denied even here: a test that reached past the
        # fixture for the ref-writing verbs would be the first sign R23
        # had gone.
        lease-tests:
          files:
            - "**/internal/lease/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes the operations that call lease, so lease must not call back
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: an obligation carries a typed Kind and Standing precisely so nothing here has to choose a sentence
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: the note is a derived export; this lifecycle writes the state ref and nothing else
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: a test that reached for the real backend would be proving something about tart; the provider seam is verifytest's job
        # run is the verification lifecycle: the queue, the two
        # sequencers, and the ONE interpreter of a provider's answer. Its
        # denials are the same layering the other lifecycles carry, plus
        # two that are specific to it and are the whole reason its seams
        # are interfaces.
        #
        # The first is the STAGER. Materializing an attempt's commit and
        # reading its preflight is git, a temp root and a MacPorts
        # evaluation — so a run that could reach eval and git would have
        # no reason to declare run.Stager at all, and the re-plan the
        # drain ruling chose would collapse back into the sequencer. The
        # seam is what makes the queue carry an identity and a question
        # rather than a filesystem path, and these two lines are what
        # holds it.
        #
        # The second is the LOCAL half of a cohort proposal. run.Local
        # exists because the propose step needs a reverse index and the
        # maintainer's Portfile cues and run holds neither; portindex is
        # ALLOWED because dependents.From takes its row type and the
        # translation crosses here as values, exactly as it does in
        # internal/dependents — naming the row type is not opening an
        # index, and nothing here does.
        run:
          files:
            - "**/internal/run/**"
            - "!**/internal/run/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app and app calls run, so run must not call back
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: the one interpreter states verdicts, not sentences a reader meets; the strings it does produce ride the record (Run.Detail) and a judge that could phrase a report would start deciding from words (rule 6)
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: the one ref-mover is statestore, and run reaches git only through it (R23); staging a commit is the Stager's, which is why that is an interface
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the preflight evaluation belongs to the Stager the composition root implements; a run that could evaluate would fold the re-plan back into the sequencer and could not be tested without a ports tree
            - pkg: github.com/herbygillot/dockhand/internal/macports/portnote
              desc: the maintainer's Portfile cues arrive through run.Local, so the propose step reads values and never a file
            - pkg: github.com/herbygillot/dockhand/internal/tempdir
              desc: where a staged portdir lives is the Stager's business; a queue that knew a path could not be drained by another process
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: that a job's id is the environment's name is one backend's fact — Observe asserts the OPTIONAL interfaces off the verify.Verifier it was handed and never names a backend
            - pkg: github.com/herbygillot/dockhand/internal/gh
              desc: a publication is a foreign effect and publish's; a lifecycle that could ask a forge would ask it from inside an Amend
            - pkg: github.com/herbygillot/dockhand/internal/upstream
              desc: where a release comes from is the planners' business; run verifies changes already planned
            - pkg: net
              desc: provider and network I/O never goes inside an Amend closure or inside a lock, and the surest way to hold that is a package that cannot reach either
        # run's own tests, on lease-tests' precedent: the same denials,
        # and the fixture repository the state ref has to live in. The
        # sequencers drive a REAL statestore over a REAL repository —
        # what they prove is an ordering of writes against a
        # compare-and-set, and a fake store would prove something about
        # the fake — so internal/git is NOT denied here.
        #
        # It cannot be, and the reason is worth stating rather than
        # leaving as a gap someone closes by accident: a rule matches by
        # PREFIX, so a line naming internal/git covers internal/git/gittest
        # too, and gittest is the fixture. The property a git denial would
        # buy — that no test moves a ref outside the store (R23) — is held
        # instead by internal/statestore/onlymover_test.go, which walks
        # the AST for callers of git.UpdateRefs and for owned ref names
        # spelled outside the store. That is a stronger check than an
        # import line, and it is where the rule already lives.
        run-tests:
          files:
            - "**/internal/run/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app and app calls run, so run must not call back
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: what a verdict looks like to a reader is report's and is pinned by report's own goldens
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the judge and the queue are testable with no ports tree behind them, and a test that opened an evaluator would end that
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: a test that reached for the real backend would be proving something about tart; the provider seam is verifytest's job
        # publish owns the publication lifecycle: the gate ladder, the
        # permit, the effects a permit authorizes, and retirement's one
        # foreign effect. Its import list is RULED and the design states
        # it: change, gh, git, macports, record, statestore — with no
        # ledger among them, which is the whole layering claim the
        # package makes. record.Record is the note's shape, a derived
        # export, and nothing decides from a derived copy; a draft had
        # publish.Facts carrying one, so the ladder would have decided
        # from the projection while every other road decided from the
        # state ref. A package that cannot reach the exporter cannot make
        # that mistake, which is why ledger is the first line below.
        #
        # darwin/abi is the one edge beyond the ruled list and it is one
        # CONSTANT wide: abi.Limits, the caveat that travels beside a
        # measurement's criterion wherever it is quoted. The pull request
        # body quotes the criterion a cohort proposal rests on, and the
        # sentence saying what otool cannot see has to be the same
        # sentence in the commit body and in the pull request — which is
        # exactly why it is a constant and not a paragraph anyone
        # rewords. abi is a pure leaf with a four-entry allow list of its
        # own, so the edge costs nothing but the constant.
        #
        # A deny list, like its sibling lifecycles, because what this
        # package must not acquire is narrower than a purity claim: it
        # pushes, it opens pull requests and it writes the state ref, so
        # it is effectful by construction. The three that matter:
        #
        #   - A TERMINAL. Authorize is pure and every mutator here runs
        #     inside an Amend closure, which may be retried; a refusal is
        #     a sentinel and an advisory is a VALUE on the result,
        #     precisely so that nothing here has to choose when a person
        #     reads it. The shipped promote printed its advisories from
        #     inside the forge walk, so no caller could count them.
        #   - THE LAYERS ABOVE. app calls publish; cli calls app. An
        #     import back is a cycle, and one that compiled would put the
        #     command line inside a transaction.
        #   - os/exec AND net. Every effect here goes through git.Repo or
        #     the gh.Runner seam, which is what lets Apply be driven by a
        #     scripted forge over a real bare repository; a package that
        #     could shell out or open a socket itself would have a second
        #     way to reach the network, and the rule that no forge call
        #     happens inside an Amend would be a rule about today's code.
        publish:
          files:
            - "**/internal/publish/**"
            - "!**/internal/publish/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: a decision reads the state ref, never the note's derived export; publish cannot even obtain a record.Record, which is what stops the gate ladder deciding from the projection
            - pkg: github.com/herbygillot/dockhand/internal/run
              desc: publication never observes, judges or settles a run — an Active attempt on the tip is an advisory naming `dockhand cancel`, and a publish that could call Finish would be a second judge
            - pkg: github.com/herbygillot/dockhand/internal/lease
              desc: an environment is run's and lease's; a publication holds none and releases none
            - pkg: github.com/herbygillot/dockhand/internal/verify
              desc: what a change is worth building is run's question; naming a job here would put a provider vocabulary under every pull request
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: a refusal here is a sentinel and an advisory is a typed value, so nothing has to choose a sentence; the pull request body is BYTES THE FORGE STORES and not a rendering for a terminal, which is why it lives here and is pinned by this package's own tests
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app and app calls publish, so publish must not call back
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the evaluation Direction needs arrives through publish.Evaluator, which app implements; a publication that could open a Tcl shell could not be argued about without a MacPorts installation
            - pkg: github.com/herbygillot/dockhand/internal/upstream
              desc: where a release comes from is the planners' business; publication weighs a change already planned
            - pkg: github.com/herbygillot/dockhand/internal/plan
              desc: re-planning a change is change.Reconstruct's, and its verdict arrives here as a parameter — a publication that held a planner would recompute its own permission
            - pkg: os/exec
              desc: every effect goes through git.Repo or the gh.Runner seam; a package that shelled out itself would have a second road to the forge, outside the funnel and outside the tests that drive it
            - pkg: net
              desc: provider and network I/O never goes inside an Amend closure or inside a lock, and the surest way to hold that is a package that cannot reach the network except through the one seam
        # publish's own tests, on lease-tests' and run-tests' precedent:
        # the same denials, and the fixture repository the state ref and
        # the bare fork have to live in.
        #
        # internal/git is NOT denied here and cannot be: a rule matches by
        # PREFIX, so a line naming internal/git covers internal/git/gittest
        # too, and gittest is the fixture. What these tests prove needs a
        # real repository — that `ls-remote` and `push --delete` behave
        # the way DeleteFork's doc says they do, and that a foreign
        # deletion leaves this machine's tracking ref standing — and a
        # fake git would prove something about the fake. The property an
        # import denial would buy (no test moves a ref outside the store,
        # R23) is held instead by internal/statestore/onlymover_test.go,
        # which walks the AST.
        publish-tests:
          files:
            - "**/internal/publish/*_test.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: a test that opened a note would be testing the projection this package is forbidden to read
            - pkg: github.com/herbygillot/dockhand/internal/run
              desc: a test that settled a run would be proving something about the verification lifecycle
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: what a refusal looks like to a reader is the report layer's and is pinned by its own goldens
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app and app calls publish, so publish must not call back
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the evaluation seam is scripted in these tests, which is the whole reason it is a seam — a publication's direction is arguable with no MacPorts installation behind it
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: a test that booted a worker would be proving something about tart; nothing here needs an environment
        # verify names a job and its outcome, and record embeds a Job, so
        # verify sits below record. An import the other way is a cycle;
        # this says so before the compiler does, with the reason on it.
        # The whole tree is covered because a provider has no business
        # knowing that its results are written down.
        verify-below-the-record:
          files:
            - "**/internal/verify/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/record
              desc: record embeds verify.Job, so verify must not know what a note is
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: a provider reports what a job did; whether that is written down is the ledger's business
        # The vocabulary itself stays cheap to import: verify's own files
        # may not reach the builder, so a package that only wants to name
        # a job does not drag a MacPorts build in behind it. The
        # providers underneath are the deliberate exception, because
        # booting a worker and provisioning it is build work, which is
        # why this rule stops at the package's own files.
        verify-vocabulary:
          files:
            - "**/internal/verify/*.go"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/macports/build
              desc: what a build needs is the provider's concern; verify only names the job and reports its outcome
        # A plan is an inert value: the edits, their provenance, the
        # precondition hash, the predicted delta. Everything that reads
        # one imports this package, report included, so what plan can
        # reach every projection can reach — and for three symbols on two
        # lines it reached the Tcl shell. The Planner interface named a
        # port handle and a fetcher as parameter types in a declaration
        # plan does not implement, and Apply took the evaluator itself
        # to ask it one question, twice. Nothing was called through any
        # of them; the types alone put os/exec in the dependency set of
        # every package that prints a plan, which is exactly the closure
        # the report rule above could not previously claim.
        #
        # The three edges are named separately because plan had three
        # independent routes down to os/exec and closing two would have
        # left the third open: distfile reaches it through tool, port
        # reaches it through eval and prefix, and eval reaches it again
        # through the Tcl session. The whole subtree is covered, tests
        # included — plan's tests script a Snapshotter rather than start
        # an evaluator, and a test that reached for a real one would be
        # the first sign the seam had gone.
        plan:
          files:
            - "**/internal/plan/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/macports/port
              desc: a plan is an inert value; the handle that could evaluate one belongs to the intent that made it
            - pkg: github.com/herbygillot/dockhand/internal/distfile
              desc: fetching is spent at plan time by the planner, never by the plan
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: Apply takes a Snapshotter, which is the two questions it actually asks; naming the evaluator here puts the Tcl shell back in report's dependency set
            - pkg: os/exec
              desc: the three edges above are the routes that existed, and this is the property they were denied for
        # change owns the change lifecycle: it prepares content, writes
        # the one commit a change is made of, and holds the mutators that
        # move a change's record inside a statestore transaction. So it
        # reaches git (it writes objects), statestore (it IS one of the
        # four owners), record (it writes the durable shape), plan (it
        # consumes one) and the MacPorts facts it judges versions by.
        #
        # A deny list, because what this package must not acquire is
        # narrower than a purity claim and each edge is worth saying at
        # the import line where somebody would add it. The three that
        # matter:
        #
        #   - A TERMINAL. Every mutator here runs inside an Amend
        #     closure, which may be retried, so a mutator that printed
        #     would print twice for one act; and the closure holds a
        #     flock every peer's status waits on. What a road says about
        #     a refusal is the road's, which is why every decline here is
        #     a sentinel and not a sentence.
        #   - A PROVIDER, or anything that reaches one. Provider and
        #     network I/O never goes inside an Amend closure, and the way
        #     to make that hold is for this package not to be able to
        #     reach one at all.
        #   - THE LAYERS ABOVE. app calls change; cli calls app. An
        #     import back is a cycle, and one that compiled would put the
        #     command line inside a transaction.
        #
        # ledger is denied for the reason Held's and Behind's doc
        # comments give: a decision reads the state ref's record.Change
        # and never the note's derived export, and a package that could
        # open a note would let one road read the copy while another
        # reads the original.
        change:
          files:
            - "**/internal/change/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/ledger
              desc: a decision reads record.Change from the state ref, never the note's derived export; custody of the notes is the ledger's
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: a refusal here is a sentinel and the words for it are the road's; a mutator that phrased its own would phrase it inside a retried closure
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app and app calls change, so change must not call back
            - pkg: github.com/herbygillot/dockhand/internal/verify
              desc: what a change is worth building is run's question; a lifecycle that named a job would put a provider vocabulary under every mint
            - pkg: github.com/herbygillot/dockhand/internal/gh
              desc: a publication is a foreign effect and publish's; a change that could ask a forge would ask it from inside an Amend
            - pkg: github.com/herbygillot/dockhand/internal/upstream
              desc: where a release comes from is the planners' business; change realizes plans already made
            - pkg: github.com/herbygillot/dockhand/internal/vendored
              desc: the vendored families are a planner's concern; a change that regenerated one would be planning
            - pkg: net
              desc: provider and network I/O never goes inside an Amend closure or inside a lock, and the surest way to hold that is a package that cannot reach either
        # app holds the OPERATIONS: one type per verb-shaped act, each
        # sequencing lifecycles it does not own. It is the widest import
        # list in the tree by design — change, run, lease, publish,
        # statestore, git, ledger, planning, progress — because
        # sequencing is exactly the job of holding several lifecycles at
        # once, and the engine facade this replaced held them all behind
        # one type instead of nine.
        #
        # So what this rule guards is not width but DIRECTION and DEPTH.
        # The three denials are the three ways an operation stops being
        # one:
        #
        #   - THE LAYER ABOVE. cli composes app; an import back is a
        #     cycle, and one that compiled would put flag parsing inside
        #     an operation. The lazy service memo that used to sit
        #     between them is gone with internal/runstate, and
        #     ChangeRequest.Needs() is what replaces the laziness.
        #   - THE WORDS. report chooses the
        #     sentences a reader meets. An operation states what happened
        #     in a typed result and narrates through progress.Sink;
        #     "nothing outside report imports report" is build step 10's
        #     own done-criterion and this line is where it is held.
        #   - THE DETAILS UNDER A SEAM. A provider backend, a Tcl
        #     evaluator, a distfile fetcher and a forge client are all
        #     reached through values the composition root hands in —
        #     verify.Verifier, run.Stager, run.Local, publish.Env — and an
        #     operation that could name one would have acquired it, which
        #     is exactly what "no operation opens a file" forbids.
        #
        # net is denied for the reason every lifecycle denies it: an
        # operation's foreign effects go through publish and verify,
        # which are the packages that own an effect that can outlive the
        # process, and an operation that could open a socket could open
        # one inside an Amend closure.
        #
        # macports/tree is NOT denied and macports/eval is, which looks
        # inconsistent and is not: tree.Target is two strings, named by
        # Cycle's publish slot so a re-plan says which port it is about,
        # and naming a value type is not opening a tree. It is run naming
        # portindex.Dependent, one layer up, for the same reason.
        #
        # WHAT THAT DOES NOT BUY IS A CLEAN CLOSURE, and the difference is
        # worth stating rather than assumed: `go list -deps ./internal/app`
        # DOES contain macports/eval and the Tcl shell, because
        # macports/port asserts *eval.Evaluator against port.Oracle so the
        # two method sets cannot drift, and planning names port.Handle. So
        # this rule holds a DIRECT-IMPORT property — no operation reaches
        # for an evaluator, a backend or a forge client itself — and the
        # transitive one belongs to the packages that own those assertions.
        app:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes app; an import back is a cycle, and one that compiled would put flag parsing inside an operation
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: an operation states what happened in a typed result and narrates through progress.Sink; nothing outside report renders, which is step 10's done-criterion
            - pkg: github.com/herbygillot/dockhand/internal/verify/tart
              desc: a provider's details arrive as a verify.Verifier the composition root acquired; an operation that named a backend would have chosen one
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: an evaluation reaches an operation through run.Stager, change.Evaluator or planning.Planner; an app that could evaluate could not be tested without a ports tree
            - pkg: github.com/herbygillot/dockhand/internal/macports/portfetch
              desc: the network is the planners' and the fetcher is planning's; an operation realizes plans already made
            - pkg: github.com/herbygillot/dockhand/internal/gh
              desc: a publication is a foreign effect and publish's; publish.Env is the whole of the forge an operation may hold
            - pkg: github.com/herbygillot/dockhand/internal/upstream
              desc: where a release comes from is the planners' business; an operation carries a change that already knows what it moves to
            - pkg: net
              desc: an operation's foreign effects go through publish and verify, which own effects that outlive the process; a package that can open a socket can open one inside an Amend
        # planning is the PRODUCER of plans and nothing else: resolve,
        # evaluate, fetch if the intent fetches, fill the parameters,
        # choose from the catalogue, run it. Its denials say the two
        # halves of that sentence.
        #
        # THE FIRST HALF IS "producer": it may not reach a lifecycle. A
        # planner that could mint, enqueue, publish or open a transaction
        # would be the second orchestrator this package exists to stop
        # being one — the six steps live here precisely so that app does
        # not hold an evaluator, a fetcher, a port handle and a tree on
        # behalf of one step, and a planning that wrote records would have
        # taken the whole layer instead.
        #
        # THE SECOND HALF IS "and nothing else": the evaluator and the
        # fetcher arrive as port.Oracle and distfile.Fetcher, which are
        # the tree's own consumer-owned seams, so this package cannot
        # acquire either. That is what lets a plan be produced in a test
        # with no MacPorts installation and no network, which is the
        # property the sketch's two one-method interfaces were describing.
        planning:
          files:
            - "**/internal/planning/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/app
              desc: app consumes a plan; planning produces one, and an import back is a cycle
            - pkg: github.com/herbygillot/dockhand/internal/cli
              desc: cli composes this and hands it to an operation; an import back would put flag parsing inside a planner
            - pkg: github.com/herbygillot/dockhand/internal/statestore
              desc: a plan is made against a Portfile and a catalogue, not against the operational record; a producer that opened a transaction would be an operation
            - pkg: github.com/herbygillot/dockhand/internal/change
              desc: planning makes a *plan.Plan and change turns it into Prepared content; the boundary between producer and consumer is this line
            - pkg: github.com/herbygillot/dockhand/internal/run
              desc: whether a plan is verified is not the planner's question; nothing here decides how far a change goes
            - pkg: github.com/herbygillot/dockhand/internal/publish
              desc: where a change ends up is decided two layers up; a planner that named a publication would be deciding it
            - pkg: github.com/herbygillot/dockhand/internal/lease
              desc: an environment is a verification's concern; planning holds none and asks for none
            - pkg: github.com/herbygillot/dockhand/internal/git
              desc: a plan is made over a portdir's bytes; the repository belongs to the roads that commit, and a producer that read one could plan against a commit nobody asked for
            - pkg: github.com/herbygillot/dockhand/internal/macports/eval
              desc: the evaluator arrives as port.Oracle so a plan can be made in a test with no MacPorts installation; acquiring one here would end that
            - pkg: github.com/herbygillot/dockhand/internal/macports/portfetch
              desc: the fetcher arrives as distfile.Fetcher for the same reason; a planner that opened its own would need the network to be tested
            - pkg: github.com/herbygillot/dockhand/internal/report
              desc: a decline here is the planner's own value and the words for it are the road's
        # cli is the cobra adapter and the COMPOSITION ROOT, so it is the
        # one package with no upward denial to make: nothing is above it.
        # What its rule guards is the thing this whole restructure exists
        # to remove — the shipped internal/cmd imported TWELVE domain
        # packages and ran multi-step verbs out of its own Actions — so
        # the line here is drawn at REACHING PAST app.
        #
        # WHAT IT MAY NAME, and why the list is not shorter. A
        # composition root builds the values an operation declares, and
        # app declares them by TYPE: app.Change carries a *git.Repo, a
        # *statestore.Store, a *ledger.Ledger, a run.Stager, a run.Local
        # and a change.Prepared, and app.Cycle carries a publish.Env, a
        # publish.Pace and a change.Evaluator. So cli names git,
        # statestore, ledger, run, change and publish because it CANNOT
        # construct an operation without naming them — that is measured
        # from app's own field declarations, not preferred — and the
        # done-criterion "cli imports app and report and nothing else of
        # the domain" is held in the only place it can be: cli calls no
        # lifecycle MUTATOR and opens no Amend. app's hold, unhold and
        # dismiss ENTRY POINTS exist for exactly that reason, three or
        # four lines apiece, so that this package never opens a
        # transaction of its own.
        #
        # WHAT IT MAY NOT REACH is what would put a JUDGMENT back where
        # flags live. internal/dependents is NOT on that list, and the
        # attempt to put it there is worth recording: run.Local returns
        # []dependents.Instruction, and this package implements run.Local,
        # so denying it denies the seam — measured, by the linter, on the
        # first run of this rule. The two below are the ones that survive:
        # evidence a judge reads, which a verb has no business reading
        # because it would be judging where it should be rendering a
        # typed result.
        #
        # The bypass this package must not perform — reaching a
        # lifecycle's sequencer directly instead of through an operation
        # — is not visible to a linter, because the packages it would
        # reach are the same ones it legitimately names. It is held by
        # app's own rule (an import back is a cycle), by app's three
        # ENTRY POINTS existing at all, and by the one line of sequencing
        # this package documents at its call site.
        cli:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/darwin/abi
              desc: an ABI measurement is a verification's evidence; a verb that read one would be judging where it should be rendering a typed result
            - pkg: github.com/herbygillot/dockhand/internal/artifact
              desc: what a guest reported is the provider's and the judge's; nothing at the command line reads a manifest
        # progress is narration and a LEAF, held by an allow list for the
        # reason record and darwin/abi are: every lifecycle needs to
        # narrate, so this package sits underneath all of them, and one
        # convenient import would put whatever it named underneath them
        # too. The allow list is one entry wide — io, for the raw build
        # log Stream passes through — and a second entry is an argument
        # rather than an edit.
        progress:
          files:
            - "**/internal/progress/**"
            - "!**/internal/progress/*_test.go"
          allow:
            - $gostd
          deny:
            - pkg: github.com/herbygillot/dockhand/internal
              desc: a sink that could name a domain type would let a fact travel through narration, which is the one thing its return-nothing methods exist to prevent
        # progress's own tests: the leaf, the harness, and nothing else.
        progress-tests:
          files:
            - "**/internal/progress/*_test.go"
          allow:
            - $gostd
            - github.com/stretchr/testify
          deny:
            - pkg: github.com/herbygillot/dockhand/internal
              desc: a test that reached for a domain type would be proving something about that type, not about narration
        # A vendored family holds one block's format and the tool that
        # writes it, and nothing above that. It says why a block cannot
        # be honest — the family is the only thing that knows — but what
        # that refusal MEANS to a plan is the planning layer's
        # vocabulary, and a generator package that names it has taken on
        # the whole layer to raise one error. So the families speak
        # vendored.Decline, and the translation happens once, in
        # vendored/families, which is the boundary the intents import and
        # the one directory this rule exempts. Crossed in one place it is
        # a boundary; crossed at every call site it is a convention.
        vendored:
          files:
            - "**/internal/vendored/**"
            - "!**/internal/vendored/families/**"
          deny:
            - pkg: github.com/herbygillot/dockhand/internal/plan
              desc: a family knows a block's format, not what a plan is; raise a vendored.Decline and let vendored/families map it

formatters:
  enable:
    - gofmt
